<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breath Monitor</title>
    <link rel="stylesheet" href="./styles.css?v=monitor-ui-20260609n" />
  </head>
  <body>
    <main class="monitor-shell">
      <section class="control-strip" aria-label="Realtime workflow controls">
        <div class="control-group primary-group">
          <span class="group-label">体验</span>
          <button id="startBtn" data-i18n="button.startMonitoring">开始监测</button>
          <button id="pauseBtn" class="secondary" data-i18n="button.pauseView">暂停视图</button>
          <button id="resetBtn" class="secondary" data-i18n="button.reset">重置</button>
        </div>
        <div class="control-group">
          <span class="group-label">记录片段</span>
          <button id="recordStartBtn" class="secondary" data-i18n="button.recordStart">开始记录</button>
          <button id="recordEndBtn" class="secondary" data-i18n="button.recordEnd" disabled>结束记录</button>
        </div>
        <div class="control-group">
          <span class="group-label">扫描标记</span>
          <button id="scanStartBtn" class="secondary" data-i18n="button.scanStart" disabled>开始扫描</button>
          <button id="scanEndBtn" class="secondary" data-i18n="button.scanEnd" disabled>结束扫描</button>
        </div>
        <div class="control-group">
          <span class="group-label">文件</span>
          <button id="saveRecordBtn" class="secondary" data-i18n="button.saveRecord" disabled>保存记录</button>
          <button id="loadRecordBtn" class="secondary" data-i18n="button.loadRecord">加载记录</button>
          <input id="loadRecordInput" type="file" accept="application/json,.json" hidden />
        </div>
      </section>

      <section class="status-grid top-status-grid" aria-label="Data status">
        <article id="connectionCard" class="connection-card" data-connection="idle">
          <span data-i18n="statusPanel.status">数据状态</span>
          <strong id="connectionStatus" data-status-key="connection.disconnected" aria-live="polite">未连接</strong>
        </article>
        <article class="metric-primary">
          <span>BPM</span>
          <strong id="bpmValue">-</strong>
        </article>
        <article>
          <span data-i18n="statusPanel.stability">稳定性</span>
          <strong id="qualityValue">-</strong>
          <small id="stabilityHintValue" data-i18n="hint.waitingEnoughBreaths">等待足够呼吸周期</small>
        </article>
        <article>
          <span data-i18n="statusPanel.intervalCv">间隔 CV</span>
          <strong id="intervalCvValue">-</strong>
          <small id="intervalCvHintValue" data-i18n="hint.intervalVariation">呼吸间隔的变化程度</small>
        </article>
        <article>
          <span data-i18n="statusPanel.rawPoints">原始点数</span>
          <strong id="rawCountValue">0</strong>
        </article>
        <article>
          <span data-i18n="statusPanel.filteredPoints">滤波点数</span>
          <strong id="filteredCountValue">0</strong>
        </article>
      </section>

      <div class="monitor-layout">
        <section class="chart-section realtime-section">
          <div class="chart-header">
            <div>
              <h2 data-i18n="chart.realtimeTitle">实时波形</h2>
              <p>灰色为原始输入，蓝色为滤波输出；红点和绿点分别表示识别到的波峰和波谷。</p>
            </div>
            <div class="chart-actions">
              <button id="followBtn" class="secondary follow-toggle" type="button">回看波形</button>
              <details class="advanced-tools">
              <summary>高级视图</summary>
              <div class="chart-tools">
                <label>
                  <span data-i18n="field.smoothing">平滑</span>
                  <select id="smoothingSelect">
                    <option value="auto" selected data-i18n="smoothing.auto">自动</option>
                    <option value="off" data-i18n="smoothing.off">关闭</option>
                    <option value="light" data-i18n="smoothing.light">轻度</option>
                    <option value="medium" data-i18n="smoothing.medium">中等</option>
                    <option value="strong" data-i18n="smoothing.strong">强</option>
                  </select>
                </label>
                <label class="checkbox-row">
                  <input id="confirmRealtimeEvents" type="checkbox" />
                  <span data-i18n="field.confirmPeaks">延迟确认峰谷</span>
                </label>
              </div>
            </details>
            </div>
          </div>
          <div class="legend">
            <span class="legend-item raw" data-i18n="legend.raw">原始</span>
            <span class="legend-item filtered" data-i18n="legend.filtered">滤波</span>
            <span class="legend-item peak" data-i18n="legend.peak">波峰</span>
            <span class="legend-item valley" data-i18n="legend.valley">波谷</span>
            <span class="legend-item recorded" data-i18n="legend.recorded">记录区间</span>
            <span class="legend-item scan" data-i18n="legend.scan">扫描区间</span>
          </div>
          <div id="waveChart" class="chart"></div>
        </section>

        <div class="runtime-values" aria-hidden="true">
          <span id="windowValue">0 - 1500 samples</span>
          <span id="recordFileValue" data-record-file-key="record.file.none">无已加载文件</span>
          <span id="lastUpdateValue">-</span>
        </div>
      </div>

      <section id="recordSection" class="chart-section record-section" hidden>
        <div class="chart-header">
          <h2 data-i18n="record.title">记录片段</h2>
          <div class="record-meta">
            <span id="recordStatus">空闲</span>
            <span id="recordDuration">0s</span>
            <span id="recordIndexRange">索引 -</span>
            <span id="recordScanRange">扫描 -</span>
            <span id="recordTimeRange">时间 -</span>
            <span id="recordPointCount">0 点</span>
            <button id="recordDetailBtn" class="record-detail-btn" type="button" data-i18n="record.details">详情</button>
          </div>
        </div>
        <div id="recordChart" class="chart record-chart"></div>
      </section>

      <dialog id="recordDetailDialog" class="record-detail-dialog">
        <section class="record-detail-sheet" aria-labelledby="recordDetailTitle">
          <header>
            <h3 id="recordDetailTitle" data-i18n="record.detailsTitle">记录详情</h3>
            <button id="recordDetailCloseBtn" class="secondary icon-close-button" type="button" aria-label="关闭" title="关闭">
              <span data-i18n="record.close">关闭</span>
            </button>
          </header>
          <div class="record-detail-list">
            <article>
              <span data-i18n="record.detail.status">状态</span>
              <strong id="recordDetailStatus">空闲</strong>
            </article>
            <article>
              <span data-i18n="record.detail.duration">时长</span>
              <strong id="recordDetailDuration">0s</strong>
            </article>
            <article>
              <span data-i18n="record.detail.index">索引</span>
              <strong id="recordDetailIndexRange">索引 -</strong>
            </article>
            <article>
              <span data-i18n="record.detail.scan">扫描</span>
              <strong id="recordDetailScanRange">扫描 -</strong>
            </article>
            <article>
              <span data-i18n="record.detail.time">时间</span>
              <strong id="recordDetailTimeRange">时间 -</strong>
            </article>
            <article>
              <span data-i18n="record.detail.points">点数</span>
              <strong id="recordDetailPointCount">0 点</strong>
            </article>
          </div>
        </section>
      </dialog>
    </main>

    <script src="../runtime-config.js"></script>
    <script src="../shared/runtime.js?v=shared-runtime-20260605"></script>
    <script src="./vendor/socket.io.min.js"></script>
    <script src="./vendor/echarts.min.js"></script>
    <script type="module" src="./app.js?v=monitor-ui-20260609n"></script>
  </body>
</html>

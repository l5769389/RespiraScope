<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RespiraScope</title>
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <link rel="alternate icon" href="./assets/logo.ico" />
    <link rel="apple-touch-icon" href="./assets/logo.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./shared/theme.css" />
  </head>
  <body class="console-app">
    <main class="console-shell">
      <header class="console-topbar">
        <div class="console-brand"><img class="brand-mark" src="./assets/logo.svg" width="40" height="40" alt="" /><div class="brand-copy">
          <h1>RespiraScope</h1><p data-text="brandSubtitle"></p>
        </div></div>
        <div class="console-actions"><div id="status-backend" class="status-pill" tabindex="0"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6h.01M7 17h.01"/></svg><span></span><strong></strong></div><div id="status-source" class="status-pill" tabindex="0"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0M12 20h.01"/></svg><span></span><strong></strong></div><div id="status-session" class="status-pill" tabindex="0"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6zM8 12l3 3 5-6"/></svg><span></span><strong></strong></div>
          <label class="language-field"><span data-text="language"></span><select id="languageSelect"><option value="zh">中文</option><option value="en">English</option></select></label>
        </div>
      </header>
      <section class="disabled-panel" hidden><h2 data-text="disabledTitle"></h2><p data-text="disabledText"></p></section>
      <section class="console-workspace">
        <nav class="mode-rail" aria-label="RespiraScope modes"><div class="mode-list"><button class="mode-button" data-mode="monitor" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h5l3-9 4 18 3-9h5"/></svg><span data-text="monitor"></span><small data-text="monitorText"></small></button><button class="mode-button" data-mode="lab" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v7L4 20h16l-6-10V3M8 15h8"/></svg><span data-text="lab"></span><small data-text="labText"></small></button></div>
          <section class="rail-guide"><span class="eyebrow" data-text="guideKicker"></span><h2 data-text="guideTitle"></h2><div class="rail-guide-list"><article class="rail-guide-item"><strong data-text="guideStartTitle"></strong><span data-text="guideStartText"></span></article><article class="rail-guide-item"><strong data-text="guideRecordStartTitle"></strong><span data-text="guideRecordStartText"></span></article><article class="rail-guide-item"><strong data-text="guideScanTitle"></strong><span data-text="guideScanText"></span></article><article class="rail-guide-item"><strong data-text="guideRecordEndTitle"></strong><span data-text="guideRecordEndText"></span></article></div></section>
        </nav>
        <div class="frame-stage"></div>
      </section>
    </main>
    <script src="./runtime-config.js"></script>
    <script src="./shared/runtime.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
